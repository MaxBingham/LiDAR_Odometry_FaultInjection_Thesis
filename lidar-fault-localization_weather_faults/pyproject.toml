[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "lfl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "tqdm>=4.64",
    "typer[all]>=0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "matplotlib>=3.6",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyquaternion>=0.9",
    "PyYAML>=6.0",
    "rich>=13.0",
    "natsort>=8.0",
    "evo>=1.20",
    "scikit-learn>=1.3",
    "seaborn>=0.12",
    "pyvista>=0.46",
]

[project.scripts]
lfl_pipeline = "lfl.cli:main"
lfa = "lfa.cli:main"

[tool.setuptools]
packages = ["lfl", "lfa", "lfi"]
package-dir = {"" = "src"}
